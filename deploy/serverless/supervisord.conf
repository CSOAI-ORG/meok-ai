; ═══════════════════════════════════════════════════════════
; MEOK.ai — Supervisor Process Manager (Serverless)
; Manages PostgreSQL + MCP Server
; Lean config for fast cold starts on Vast.ai
; ═══════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; ─── PostgreSQL ──────────────────────────────────────────
[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=127.0.0.1
user=postgres
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log

; ─── MEOK MCP Server ────────────────────────────────────
[program:meok]
command=python -m meok.mcp.server
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=15
startretries=5
environment=PYTHONPATH="/app"
stdout_logfile=/var/log/supervisor/meok.log
stderr_logfile=/var/log/supervisor/meok_err.log
