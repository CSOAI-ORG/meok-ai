# ═══════════════════════════════════════════════════════════════════════
# MEOK SOVEREIGN LLM GATEWAY — LiteLLM Unified Configuration
# All LLMs route through localhost:4000 — one gateway, all models
# ═══════════════════════════════════════════════════════════════════════

model_list:
  # ── LOCAL OLLAMA (always available, zero cost) ──────────────────────
  - model_name: llama-local
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://localhost:11434

  - model_name: qwen-local
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://localhost:11434

  - model_name: gemma-local
    litellm_params:
      model: ollama/gemma3:4b
      api_base: http://localhost:11434

  # ── M2 MACBOOK (always-on, 8GB, SSH) ────────────────────────────────
  # Nick's M2 runs 24/7 — use for background tasks, training, embeddings
  - model_name: m2-llama
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://192.168.1.159:11434

  - model_name: m2-qwen
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://192.168.1.159:11434

  - model_name: m2-embed
    litellm_params:
      model: ollama/bge-m3:latest
      api_base: http://192.168.1.159:11434

  # ── VAST.AI GPU (Gemma 4 31B via SSH tunnel) ───────────────────────
  - model_name: gemma4-gpu
    litellm_params:
      model: ollama/gemma4:31b
      api_base: http://localhost:11436

  # ── CEREBRAS (free tier, ultra-fast 450 tok/s) ─────────────────────
  - model_name: cerebras-fast
    litellm_params:
      model: cerebras/llama-3.1-70b
      api_key: os.environ/CEREBRAS_API_KEY

  - model_name: cerebras-small
    litellm_params:
      model: cerebras/llama-3.1-8b
      api_key: os.environ/CEREBRAS_API_KEY

  # ── GROQ (free tier, fast inference) ───────────────────────────────
  - model_name: groq-fast
    litellm_params:
      model: groq/llama-3.1-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: groq-small
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  # ── OPENROUTER (400+ models, pay-per-use) ──────────────────────────
  - model_name: deepseek-reasoner
    litellm_params:
      model: openrouter/deepseek/deepseek-reasoner
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: deepseek-coder
    litellm_params:
      model: openrouter/deepseek/deepseek-coder
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-preview:thinking
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gemini-pro
    litellm_params:
      model: openrouter/google/gemini-2.5-pro
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: qwen-coder-cloud
    litellm_params:
      model: openrouter/qwen/qwen3-coder
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: minimax-chat
    litellm_params:
      model: openrouter/minimax/minimax-text-01
      api_key: os.environ/OPENROUTER_API_KEY

  # Larger models (for complex reasoning, deep research)
  - model_name: deepseek-v3
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: llama-405b
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-405b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: qwen-72b
    litellm_params:
      model: openrouter/qwen/qwen-2.5-72b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: mistral-large
    litellm_params:
      model: openrouter/mistralai/mistral-large-latest
      api_key: os.environ/OPENROUTER_API_KEY

# ── ROUTING (task → model) ───────────────────────────────────────────
router_settings:
  routing_strategy: "usage-based-routing-v2"
  enable_pre_call_checks: true
  num_retries: 2
  timeout: 60
  allowed_fails: 2
  retry_after: 5

  # Model groups for fallback chains
  model_group_alias:
    reasoning: ["deepseek-reasoner", "gemini-pro", "cerebras-fast", "llama-local"]
    coding: ["deepseek-coder", "qwen-coder-cloud", "qwen-local"]
    fast: ["cerebras-fast", "groq-fast", "llama-local"]
    creative: ["gemini-flash", "minimax-chat", "gemma-local"]
    research: ["gemini-pro", "deepseek-reasoner", "cerebras-fast"]
    local: ["gemma4-gpu", "llama-local", "qwen-local", "gemma-local"]
    sovereign: ["gemma4-gpu", "deepseek-reasoner", "cerebras-fast"]

# ── SETTINGS ─────────────────────────────────────────────────────────
litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 60
  telemetry: false
  master_key: "meok-sovereign-key"
  cache: true
  cache_params:
    type: "local"
    ttl: 3600

general_settings:
  master_key: "meok-sovereign-key"
  alerting: ["log"]

# ── ADMIN UI ─────────────────────────────────────────────────────────
admin_ui:
  enabled: true
  username: admin
  password: meokadmin123
