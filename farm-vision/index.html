<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MEOK AI — Farm Vision</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0d0c18 0%, #1a1a2e 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 100vh;
        }

        #camera-container {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 16px;
            margin: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #capture-canvas { display: none; }

        #ai-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(13,12,24,0.9));
            padding: 24px 20px 140px;
            max-height: 60%;
            overflow-y: auto;
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        #ai-response {
            font-size: 16px;
            line-height: 1.7;
            color: #f8f4e6;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            font-weight: 400;
            padding: 8px 0;
        }
        #ai-response .label {
            color: #ffd700;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            display: inline-block;
            background: rgba(255,215,0,0.1);
            padding: 4px 8px;
            border-radius: 12px;
        }

        #context-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(13,12,24,0.7);
            backdrop-filter: blur(20px);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        #context-bar .left-section,
        #context-bar .center-section,
        #context-bar .right-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #context-bar .weather { 
            color: #00d4ff; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #context-bar .location { 
            color: #ffd700; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #context-bar .time { 
            color: #aaa; 
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 12px;
        }
        #context-bar .fps-counter {
            color: #ff9e9e;
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }
        #context-bar .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }
        #context-bar .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        #controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13,12,24,0.8);
            backdrop-filter: blur(24px);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(201,168,76,0.3);
            background: rgba(201,168,76,0.1);
            color: #ffd700;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.95);
            background: rgba(201,168,76,0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: rgba(201,168,76,0.15);
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.2),
                transparent
            );
            transition: left 0.5s;
        }
        .btn:hover::before {
            left: 100%;
        }
        .btn.active {
            background: #ffd700;
            color: #0d0c18;
            box-shadow: 0 0 0 3px rgba(255,215,0,0.3);
        }
        .btn-large {
            width: 78px;
            height: 78px;
            font-size: 30px;
            border-width: 3px;
        }
        .btn-large:hover {
            transform: scale(1.05);
        }

        #status {
            position: absolute;
            top: 60px;
            right: 16px;
            background: rgba(13,12,24,0.7);
            backdrop-filter: blur(20px);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        #status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
        }
        #status.listening .dot { background: #00d4ff; animation: pulse 1s infinite; }
        #status.thinking .dot { background: #a855f7; animation: pulse 0.5s infinite; }
        #status.speaking .dot { background: #ffd700; animation: pulse 0.3s infinite; }
        #status.ready .dot { background: #4caf50; }
        #status.error .dot { background: #f44336; }
        #status-text {
            font-weight: 500;
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(201,168,76,0.3);
            border-top-color: #c9a84c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Settings Panel Styles */
        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            z-index: 1000;
            padding: 20px;
        }
        .settings-panel.visible {
            display: flex;
        }
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .settings-header h3 {
            color: #ffd700;
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }
        .btn-close {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-close:hover {
            background: rgba(255,255,255,0.2);
            transform: rotate(90deg);
        }
        .settings-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
        }
        .settings-content::-webkit-scrollbar {
            width: 6px;
        }
        .settings-content::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        .settings-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }
        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .setting-item label {
            font-size: 14px;
            font-weight: 500;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .setting-item label span {
            background: rgba(255,215,0,0.2);
            color: #ffd700;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }
        .setting-item input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            outline: none;
        }
        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #ffd700;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .setting-item input[type="range"]::-webkit-slider-thumb:hover {
            background: #ffed4e;
            transform: scale(1.2);
        }
        .btn-reset {
            align-self: flex-start;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-reset:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        #history {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 200px;
            overflow-y: auto;
            padding: 16px;
            display: none;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            margin: 0 16px 16px 16px;
        }
        #history.visible { display: block; }
        .history-item {
            background: rgba(30,30,46,0.8);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            font-size: 14px;
            border-left: 3px solid;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .history-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .history-item .time { 
            color: #888; 
            font-size: 11px; 
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .history-item .mode { 
            color: #ffd700; 
            font-size: 11px; 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            background: rgba(255,215,0,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .history-item .confidence {
            font-size: 10px;
            color: #00d4ff;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .history-item .confidence::before {
            content: "●";
            font-size: 6px;
        }

        #mode-selector {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(13,12,24,0.6);
            backdrop-filter: blur(20px);
            padding: 8px 12px;
            border-radius: 24px;
            overflow-x: auto;
            max-width: 95%;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .mode-btn {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.05);
            color: #bbb;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mode-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: translateY(-2px);
        }
        .mode-btn.active {
            background: #ffd700;
            color: #0d0c18;
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255,215,0,0.3);
            transform: translateY(-2px);
        }
        .mode-btn-icon {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="camera-container">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="capture-canvas"></canvas>

        <div id="context-bar">
            <div class="left-section">
                <span class="location">📍 MEOK Farm</span>
                <span class="weather" id="weather">⏳ Loading...</span>
            </div>
            <div class="center-section">
                <span class="time" id="clock">--:--</span>
                <span class="fps-counter" id="fps">-- FPS</span>
            </div>
            <div class="right-section">
                <div class="status-indicator">
                    <div class="status-dot" id="sov3-status" style="background: #ff6b6b;"></div>
                    <span id="sov3-text">SOV3: Checking...</span>
                </div>
            </div>
        </div>

        <div id="mode-selector">
            <button class="mode-btn active" data-mode="general">General</button>
            <button class="mode-btn" data-mode="livestock">Livestock</button>
            <button class="mode-btn" data-mode="crops">Crops</button>
            <button class="mode-btn" data-mode="infrastructure">Infrastructure</button>
            <button class="mode-btn" data-mode="wildlife">Wildlife</button>
        </div>

        <div id="status">
            <span class="dot"></span>
            <span id="status-text">Ready</span>
        </div>

        <div id="ai-overlay">
            <div class="label">🤖 MEOK AI — Farm Vision</div>
            <div id="ai-response">Tap 📸 to capture and analyze. Hold 🎤 to ask questions hands-free.</div>
        </div>

        <div id="history"></div>
    </div>

    <div id="controls">
        <button class="btn" id="btn-history" title="History">📋</button>
        <button class="btn btn-large" id="btn-capture" title="Capture & Analyze">📸</button>
        <button class="btn" id="btn-voice" title="Hold to speak">🎤</button>
    </div>

    <script>
        const API_URL = window.location.origin;
        let currentMode = 'general';
        let isCapturing = false;
        let isListening = false;
        let recognition = null;
        let history = [];

        const video = document.getElementById('camera');
        const canvas = document.getElementById('capture-canvas');
        const ctx = canvas.getContext('2d');
        const aiResponse = document.getElementById('ai-response');
        const status = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const weatherEl = document.getElementById('weather');
        const clockEl = document.getElementById('clock');
        const historyEl = document.getElementById('history');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: true
                });
                video.srcObject = stream;
                setStatus('ready', 'Camera ready');
            } catch (err) {
                setStatus('error', 'Camera unavailable');
                aiResponse.innerHTML = '⚠️ Camera access denied. Please allow camera access and reload.';
            }
        }

        function setStatus(state, text) {
            status.className = state;
            statusText.textContent = text;
        }

        function updateClock() {
            const now = new Date();
            clockEl.textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchWeather() {
            try {
                const resp = await fetch(`${API_URL}/api/weather`);
                const data = await resp.json();
                if (data.temp_c) {
                    weatherEl.textContent = `${data.temp_c}°C ${data.condition}`;
                }
            } catch {
                weatherEl.textContent = '🌤️ UK Farm';
            }
        }
        
        async function checkSOV3Status() {
            try {
                const resp = await fetch(`${API_URL}/api/status`);
                const data = await resp.json();
                const sov3StatusDot = document.getElementById('sov3-status');
                const sov3StatusText = document.getElementById('sov3-text');
                if (data.sov3) {
                    sov3StatusDot.style.background = '#4caf50';
                    sov3StatusText.textContent = 'SOV3: Connected';
                } else {
                    sov3StatusDot.style.background = '#ff6b6b';
                    sov3StatusText.textContent = 'SOV3: Disconnected';
                }
            } catch (err) {
                const sov3StatusDot = document.getElementById('sov3-status');
                const sov3StatusText = document.getElementById('sov3-text');
                sov3StatusDot.style.background = '#ff6b6b';
                sov3StatusText.textContent = 'SOV3: Error';
            }
        }
        
        let lastTime = 0;
        function updateFPS() {
            const now = performance.now();
            const fps = 1000 / (now - lastTime);
            const fpsEl = document.getElementById('fps');
            if (fpsEl) {
                fpsEl.textContent = `${Math.round(fps)} FPS`;
            }
            lastTime = now;
            requestAnimationFrame(updateFPS);
        }
        
        fetchWeather();
        checkSOV3Status();
        setInterval(fetchWeather, 300000);
        setInterval(checkSOV3Status, 5000);
        requestAnimationFrame(updateFPS);

        async function captureAndAnalyze() {
            if (isCapturing) return;
            isCapturing = true;
            setStatus('thinking', 'Analyzing...');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const imageBase64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

            aiResponse.innerHTML = '<div class="spinner"></div> Analyzing with Qwen3 VL 235B...';

            try {
                const resp = await fetch(`${API_URL}/api/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: imageBase64,
                        mode: currentMode
                    })
                });

                const data = await resp.json();

                if (data.success) {
                    aiResponse.innerHTML = data.analysis.replace(/\n/g, '<br>');
                    setStatus('ready', 'Analysis complete');
                    fetchHistory();
                } else {
                    aiResponse.innerHTML = `⚠️ ${data.error || 'Analysis failed'}`;
                    setStatus('error', 'Failed');
                }
            } catch (err) {
                aiResponse.innerHTML = '⚠️ Connection failed. Check WiFi and try again.';
                setStatus('error', 'Connection failed');
            }

            isCapturing = false;
        }

        async function fetchHistory() {
            try {
                const resp = await fetch(`${API_URL}/api/history`);
                history = await resp.json();
                renderHistory();
            } catch {}
        }

        function renderHistory() {
            historyEl.innerHTML = history.map(item => {
                // Calculate a mock confidence score based on analysis length and keywords
                const confidence = Math.min(95, Math.max(60, 
                    Math.floor((item.analysis.length / 10) + 
                    (item.analysis.toLowerCase().includes('healthy') || 
                     item.analysis.toLowerCase().includes('clear') || 
                     item.analysis.toLowerCase().includes('good') ? 15 : 0) +
                    (item.analysis.toLowerCase().includes('concern') || 
                     item.analysis.toLowerCase().includes('issue') || 
                     item.analysis.toLowerCase().includes('problem') ? -10 : 0)
                ));
                
                const confidenceColor = confidence >= 80 ? '#4caf50' : 
                                      confidence >= 60 ? '#ff9800' : '#f44336';
                                      
                return `
                    <div class="history-item" style="border-left-color: ${confidenceColor};">
                        <div class="time">${new Date(item.timestamp).toLocaleTimeString('en-GB')}</div>
                        <div class="mode">${item.mode.toUpperCase()}</div>
                        <div>${item.analysis.substring(0, 150)}...</div>
                        <div class="confidence">
                            <span>Confidence: </span>
                            <span style="color: ${confidenceColor}; font-weight: 600;">${confidence}%</span>
        </div>
        
        <!-- Settings Panel -->
        <div id="settings-panel" class="settings-panel">
            <div class="settings-header">
                <h3>Camera Settings</h3>
                <button id="close-settings" class="btn-close">✕</button>
            </div>
            <div class="settings-content">
                <div class="setting-item">
                    <label for="brightness">Brightness</label>
                    <input type="range" id="brightness" min="-100" max="100" value="0">
                    <span id="brightness-value">0</span>%
                </div>
                <div class="setting-item">
                    <label for="contrast">Contrast</label>
                    <input type="range" id="contrast" min="-100" max="100" value="0">
                    <span id="contrast-value">0</span>%
                </div>
                <div class="setting-item">
                    <label for="saturation">Saturation</label>
                    <input type="range" id="saturation" min="-100" max="100" value="0">
                    <span id="saturation-value">0</span>%
                </div>
                <div class="setting-item">
                    <label for="zoom">Zoom</label>
                    <input type="range" id="zoom" min="100" max="300" value="100">
                    <span id="zoom-value">100</span>%
                </div>
                <div class="setting-item">
                    <label for="exposure">Exposure</label>
                    <input type="range" id="exposure" min="-6" max="6" value="0" step="0.1">
                    <span id="exposure-value">0</span>
                </div>
                <button id="reset-settings" class="btn-reset">Reset to Default</button>
            </div>
        </div>
        
        <!-- Settings Button -->
        <button id="btn-settings" class="btn" title="Settings">⚙️</button>
    </div>
                    </div>
                `;
            }).join('');
        }

        function initVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                document.getElementById('btn-voice').style.display = 'none';
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-GB';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                setStatus('thinking', 'Processing...');
                aiResponse.innerHTML = `<div class="spinner"></div> You: "${transcript}"`;
                
                fetch(`${API_URL}/api/voice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: transcript })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        aiResponse.innerHTML = data.response.replace(/\n/g, '<br>');
                        setStatus('ready', 'Ready');
                    } else {
                        aiResponse.innerHTML = `⚠️ ${data.error}`;
                        setStatus('error', 'Failed');
                    }
                })
                .catch(() => {
                    aiResponse.innerHTML = '⚠️ Response failed.';
                    setStatus('error', 'Failed');
                });
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('btn-voice').classList.remove('active');
            };

            const btn = document.getElementById('btn-voice');
            const startListening = (e) => {
                e.preventDefault();
                isListening = true;
                btn.classList.add('active');
                setStatus('listening', 'Listening...');
                recognition.start();
            };
            const stopListening = () => {
                if (isListening) recognition.stop();
            };

            btn.addEventListener('touchstart', startListening);
            btn.addEventListener('touchend', stopListening);
            btn.addEventListener('mousedown', startListening);
            btn.addEventListener('mouseup', stopListening);
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                setStatus('ready', `Mode: ${currentMode}`);
            });
        });

        document.getElementById('btn-capture').addEventListener('click', captureAndAnalyze);
        document.getElementById('btn-capture').addEventListener('touchend', (e) => {
            e.preventDefault();
            captureAndAnalyze();
        });

        document.getElementById('btn-history').addEventListener('click', () => {
            historyEl.classList.toggle('visible');
            if (historyEl.classList.contains('visible')) fetchHistory();
        });

        initCamera();
        initVoice();
        initSettings();
        setStatus('ready', 'Farm Vision active');
    </script>

    <script>
        // Settings functionality
        function initSettings() {
            const settingsPanel = document.getElementById('settings-panel');
            const btnSettings = document.getElementById('btn-settings');
            const closeSettings = document.getElementById('close-settings');
            const resetSettings = document.getElementById('reset-settings');
            
            // Settings controls
            const brightnessControl = document.getElementById('brightness');
            const brightnessValue = document.getElementById('brightness-value');
            const contrastControl = document.getElementById('contrast');
            const contrastValue = document.getElementById('contrast-value');
            const saturationControl = document.getElementById('saturation');
            const saturationValue = document.getElementById('saturation-value');
            const zoomControl = document.getElementById('zoom');
            const zoomValue = document.getElementById('zoom-value');
            const exposureControl = document.getElementById('exposure');
            const exposureValue = document.getElementById('exposure-value');
            
            // Open settings
            btnSettings.addEventListener('click', () => {
                settingsPanel.classList.add('visible');
            });
            
            // Close settings
            closeSettings.addEventListener('click', () => {
                settingsPanel.classList.remove('visible');
            });
            
            // Reset settings
            resetSettings.addEventListener('click', () => {
                brightnessControl.value = 0;
                brightnessValue.textContent = '0';
                contrastControl.value = 0;
                contrastValue.textContent = '0';
                saturationControl.value = 0;
                saturationValue.textContent = '0';
                zoomControl.value = 100;
                zoomValue.textContent = '100';
                exposureControl.value = 0;
                exposureValue.textContent = '0';
                applyVideoSettings();
            });
            
            // Update value displays
            brightnessControl.addEventListener('input', () => {
                brightnessValue.textContent = brightnessControl.value;
                applyVideoSettings();
            });
            
            contrastControl.addEventListener('input', () => {
                contrastValue.textContent = contrastControl.value;
                applyVideoSettings();
            });
            
            saturationControl.addEventListener('input', () => {
                saturationValue.textContent = saturationControl.value;
                applyVideoSettings();
            });
            
            zoomControl.addEventListener('input', () => {
                zoomValue.textContent = zoomControl.value;
                applyVideoSettings();
            });
            
            exposureControl.addEventListener('input', () => {
                exposureValue.textContent = exposureControl.value;
                applyVideoSettings();
            });
            
            // Apply video settings
            function applyVideoSettings() {
                if (!video) return;
                
                const brightness = parseInt(brightnessControl.value);
                const contrast = parseInt(contrastControl.value);
                const saturation = parseInt(saturationControl.value);
                const zoom = parseInt(zoomControl.value) / 100;
                const exposure = parseFloat(exposureControl.value);
                
                // Apply CSS filters
                video.style.filter = `
                    brightness(${100 + brightness}%)
                    contrast(${100 + contrast}%)
                    saturate(${100 + saturation}%)
                `;
                
                // Apply zoom (scale)
                video.style.transform = `scale(${zoom})`;
                
                // Note: Actual exposure control would require access to media track constraints
                // This is a simplified version for demo purposes
            }
        }
        
        // Enhanced voice feedback
        function updateVoiceFeedback(listening) {
            const statusDot = document.querySelector('#status .dot');
            const statusText = document.getElementById('status-text');
            
            if (listening) {
                statusDot.style.background = '#00d4ff';
                statusDot.style.animation = 'pulse 1s infinite';
                statusText.textContent = 'Listening...';
            } else {
                statusDot.style.animation = 'none';
                // Keep current state color
            }
        }
        
        // Enhanced capture functionality with loading states
        const originalCaptureAndAnalyze = captureAndAnalyze;
        window.captureAndAnalyze = async function() {
            if (isCapturing) return;
            isCapturing = true;
            setStatus('thinking', 'Analyzing...');
            
            // Add visual feedback to capture button
            const captureBtn = document.getElementById('btn-capture');
            captureBtn.innerHTML = '<div class="spinner"></div>';
            captureBtn.disabled = true;
            
            try {
                await originalCaptureAndAnalyze();
            } catch (error) {
                console.error('Capture error:', error);
                setStatus('error', 'Capture failed');
                aiResponse.innerHTML = '⚠️ Capture failed. Please try again.';
            } finally {
                isCapturing = false;
                captureBtn.innerHTML = '📸';
                captureBtn.disabled = false;
            }
        };
        
        // Enhanced voice button feedback
        const originalInitVoice = initVoice;
        window.initVoice = function() {
            originalInitVoice();
            
            const voiceBtn = document.getElementById('btn-voice');
            if (voiceBtn) {
                voiceBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    updateVoiceFeedback(true);
                });
                voiceBtn.addEventListener('touchend', () => {
                    updateVoiceFeedback(false);
                });
                voiceBtn.addEventListener('mousedown', () => {
                    updateVoiceFeedback(true);
                });
                voiceBtn.addEventListener('mouseup', () => {
                    updateVoiceFeedback(false);
                });
                voiceBtn.addEventListener('mouseleave', () => {
                    updateVoiceFeedback(false);
                });
            }
        };
    </script>
</body>
